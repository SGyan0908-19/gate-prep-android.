name: Build GATE Prep APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate project (unzips a ZIP if needed)
        shell: bash
        run: |
          set -eu
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -n1)" ]; then
            Z="$(find . -maxdepth 2 -name '*.zip' | head -n1)"
            echo "No settings.gradle found; trying ZIP: ${Z:-none}"
            [ -n "$Z" ] || { echo "No Gradle project and no ZIP in repo"; exit 1; }
            mkdir -p /tmp/proj && unzip -q -o "$Z" -d /tmp/proj
            P="$(dirname "$(find /tmp/proj -name settings.gradle | head -n1)")"
