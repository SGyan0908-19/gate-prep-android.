name: Build GATE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already ship the Android SDK.
      # This replaces android-actions/setup-android, which was failing with
      # "sdkmanager exit code 1". Here we use the SDK that is already on the
      # runner, accept its licenses, and make sure API 35 is present.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          ls -la "$SDK" || true
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true

          SDKM=""
          if [ -d "$SDK/cmdline-tools" ]; then
            SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          # Fallback: download Google's command-line tools if the runner lacks them.
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "sdkmanager not found on runner; downloading command-line tools"
