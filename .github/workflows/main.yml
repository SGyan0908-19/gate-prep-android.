name: Build GATE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner already has the Android SDK (API 35 and build-tools 35.0.0).
      # We only accept the licenses so Gradle is never blocked.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project ZIP
        run: |
          test -f GATE_APK_Build_Project.zip
          unzip -l GATE_APK_Build_Project.zip

      - name: Extract Android project
        run: |
          rm -rf buildsrc
          mkdir -p buildsrc
          unzip -q GATE_APK_Build_Project.zip -d buildsrc
          find buildsrc -maxdepth 6 -type f | sort
          test -f buildsrc/gate_android_build/settings.gradle
          test -f buildsrc/gate_android_build/app/build.gradle
          test -f buildsrc/gate_android_build/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace \
            -p buildsrc/gate_android_build \
            assembleDebug 2>&1 | tee gradle-build.log

      - name: Show build errors in run summary
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build failed - key lines from the log"
            echo '```'
            grep -nE "What went wrong|FAILURE|error:|Error:|Could not|Execution failed|Caused by|sdkmanager|license" gradle-build.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GATE-Prep-APK
          path: buildsrc/gate_android_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log and reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gradle-build.log
            buildsrc/gate_android_build/app/build/reports/**
          if-no-files-found: ignore
